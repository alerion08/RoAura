name: Quest research database (isolated)

on:
  push:
    branches:
      - research/quest-database
    paths:
      - research/quest-database/build.py
      - research/quest-database/enrich.py
      - research/quest-database/test_enrich.py
      - research/quest-database/graph.py
      - research/quest-database/reconcile.py
      - research/quest-database/test_graph.py
      - research/quest-database/test_reconcile.py
      - research/quest-database/state.py
      - research/quest-database/test_state.py
      - research/quest-database/runtime.py
      - research/quest-database/test_runtime.py
      - research/quest-database/augment.py
      - research/quest-database/test_augment.py
      - research/quest-database/quality.py
      - research/quest-database/test_quality.py
      - .github/workflows/quest-research.yml
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: "Re-crawl public sources (otherwise reuse the current checked-in snapshot)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: research-quest-database
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout latest research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pyyaml
      - name: Regression tests for wiki parser and script linking
        run: |
          cd research/quest-database
          python -m unittest -v test_enrich.py test_graph.py test_reconcile.py test_state.py test_runtime.py test_augment.py test_quality.py
      - name: Rebuild research and runtime SQLite
        run: |
          if [ "${{ github.event.inputs.refresh_sources }}" = "true" ] || [ "${{ github.event.head_commit.message }}" = "research: perform one-time full NPC source refresh" ]; then
            python research/quest-database/build.py --out research/quest-database/output
          else
            python research/quest-database/build.py --out research/quest-database/output --enrich-only
          fi
      - name: Validate finished SQLite
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          p=Path("research/quest-database/output/quest_research.sqlite")
          con=sqlite3.connect(p)
          assert con.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not con.execute("PRAGMA foreign_key_check").fetchall()
          scripts=con.execute("select count(*) from provenance").fetchone()[0]
          assert scripts>0, "No NPC scripts collected"
          pcount=con.execute("SELECT count(*) FROM wiki_pages WHERE status='walkthrough_parsed'").fetchone()[0]
          nsteps=con.execute("SELECT count(*) FROM wiki_step_sources WHERE kind in ('numbered','ordered_list')").fetchone()[0]
          linked=con.execute("SELECT count(DISTINCT page_id) FROM wiki_script_links").fetchone()[0]
          sample=con.execute("SELECT count(*) FROM wiki_steps s JOIN wiki_pages p ON p.id=s.page_id WHERE p.title='Kiel Hyre Quest'").fetchone()[0]
          assert nsteps>=500, f"Suspicious numbered guide extraction: {nsteps}"
          juice=con.execute("SELECT count(*) FROM wiki_steps s JOIN wiki_pages p ON p.id=s.page_id WHERE p.title='Juice Quest'").fetchone()[0]
          assert sample>=60, f"Kiel Hyre walkthrough lost steps: {sample}"
          assert juice>=3, f"Juice Quest walkthrough lost steps: {juice}"
          assert linked>=30, f"Too few quest-script candidates: {linked}"
          flow_points=con.execute("SELECT count(*) FROM npc_flow_points").fetchone()[0]
          flow_options=con.execute("SELECT count(*) FROM npc_flow_options").fetchone()[0]
          flow_edges=con.execute("SELECT count(*) FROM npc_flow_edges").fetchone()[0]
          reviewed=con.execute("SELECT count(*) FROM wiki_script_reviews").fetchone()[0]
          assert flow_points>=100, f"No useful dialogue menus: {flow_points}"
          assert flow_options>=100, f"No dialogue options: {flow_options}"
          assert flow_edges>=10, f"No explicit flow edges: {flow_edges}"
          assert reviewed==con.execute("SELECT count(*) FROM wiki_pages").fetchone()[0]
          evidence=con.execute("SELECT value FROM research_meta WHERE key='matching_revision'").fetchone()
          assert evidence and evidence[0]=='header_and_correlated_npc_coordinate_v1'
          print("Script-link evidence:",con.execute("SELECT method,count(*) FROM wiki_script_links GROUP BY method").fetchall())
          print("Provider/source scopes:",con.execute("""
             SELECT project,
                    CASE WHEN path LIKE 'npc/pre-re/%' THEN 'pre-re'
                         WHEN path LIKE 'npc/re/%' THEN 'renewal'
                         ELSE 'common' END,
                    count(*)
             FROM provenance GROUP BY project,2""").fetchall())
          roles={x[0]:x[1] for x in con.execute("SELECT role,count(*) FROM npc_state_facts GROUP BY role")}
          assert roles.get('quest_start',0)>0 and roles.get('quest_check',0)>0, roles
          assert roles.get('item_grant',0)>0 and roles.get('item_check',0)>0, roles
          assert roles.get('variable_write',0)>0, roles
          ref_count=con.execute("SELECT count(*) FROM npc_quest_registry_refs").fetchone()[0]
          assert ref_count>0, f"No registry-linked quest state evidence: {ref_count}"
          output=Path("research/quest-database/output/questie_catalog.sqlite")
          assert output.is_file() and output.stat().st_size>100000
          consumer=sqlite3.connect(output)
          assert consumer.execute("PRAGMA user_version").fetchone()[0]==2
          assert consumer.execute("SELECT count(*) FROM quest_quality").fetchone()[0]==con.execute("SELECT count(*) FROM wiki_pages").fetchone()[0]
          assert consumer.execute("SELECT count(*) FROM scripts WHERE variant_scope IN ('common','pre-re','renewal')").fetchone()[0]==scripts
          assert con.execute("SELECT count(*) FROM wiki_refresh_state").fetchone()[0]==con.execute("SELECT count(*) FROM wiki_pages").fetchone()[0]
          assert consumer.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not consumer.execute("PRAGMA foreign_key_check").fetchall()
          assert consumer.execute("SELECT count(*) FROM quests").fetchone()[0]==con.execute("SELECT count(*) FROM wiki_pages").fetchone()[0]
          assert consumer.execute("SELECT count(*) FROM quest_steps").fetchone()[0]==con.execute("SELECT count(*) FROM wiki_steps").fetchone()[0]
          assert consumer.execute("SELECT count(*) FROM dialogue_options").fetchone()[0]==con.execute("SELECT count(*) FROM npc_flow_options").fetchone()[0]
          assert consumer.execute("SELECT count(*) FROM quest_state_facts").fetchone()[0]==con.execute("SELECT count(*) FROM npc_state_facts").fetchone()[0]
          print(f"Quest state roles: {roles}; registry links={ref_count}; runtime SQLite={output.stat().st_size} bytes")
          consumer.close()
          print(f"NPC graph: {flow_points} menu points, {flow_options} options, {flow_edges} resolved edges, {reviewed} review rows")
          print(f"Wiki: {pcount} numbered guide pages, {nsteps} steps, {linked} pages with script candidates; Kiel Hyre {sample} steps")
          print(f"Verified SQLite: {p.stat().st_size} bytes; {scripts} original scripts.")
          PY
      - name: Archive verified database
        uses: actions/upload-artifact@v4
        with:
          name: quest-research-database
          path: |
            research/quest-database/output/quest_research.sqlite
            research/quest-database/output/quest_research.sqlite.gz
            research/quest-database/output/coverage.json
            research/quest-database/output/questie_catalog.sqlite
            research/quest-database/output/questie_catalog.sqlite.gz
          if-no-files-found: error
          retention-days: 30
      - name: Publish database to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/quest-database/output/quest_research.sqlite research/quest-database/output/quest_research.sqlite.gz research/quest-database/output/coverage.json research/quest-database/output/questie_catalog.sqlite research/quest-database/output/questie_catalog.sqlite.gz
          if git diff --cached --quiet; then
            echo "No database changes to publish."
            exit 0
          fi
          git commit -m "research: refresh extracted quest source database [skip ci]"
          # Docs and scripts may have been committed after this run started.
          # Rebase the generated data commit onto the latest research head.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Database published to $GITHUB_REF_NAME"
              exit 0
            fi
            echo "Remote advanced during publication; retrying ($attempt/3)"
          done
          echo "Database artifact uploaded, but branch update failed."
          exit 1
