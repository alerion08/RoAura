name: Quest graph tests (fast)
on:
  push:
    branches: [research/quest-database]
    paths:
      - research/quest-database/graph.py
      - research/quest-database/reconcile.py
      - research/quest-database/test_reconcile.py
      - research/quest-database/state.py
      - research/quest-database/test_state.py
      - research/quest-database/runtime.py
      - research/quest-database/test_runtime.py
      - research/quest-database/augment.py
      - research/quest-database/test_augment.py
      - research/quest-database/quality.py
      - research/quest-database/test_quality.py
      - research/quest-database/audit.py
      - research/quest-database/test_audit.py
      - research/quest-database/triage.py
      - research/quest-database/test_triage.py
      - research/quest-database/baseline.py
      - research/quest-database/test_baseline.py
      - research/quest-database/content.py
      - research/quest-database/test_content.py
      - research/quest-database/name_links.py
      - research/quest-database/test_name_links.py
      - research/quest-database/dependencies.py
      - research/quest-database/test_dependencies.py
      - research/quest-database/discovery.py
      - research/quest-database/test_discovery.py
      - research/quest-database/prerequisites.py
      - research/quest-database/test_prerequisites.py
      - research/quest-database/test_graph.py
      - research/quest-database/enrich.py
      - .github/workflows/quest-graph-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/quest-database
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q requests beautifulsoup4 pyyaml
      - run: cd research/quest-database && python -m unittest -v test_enrich.py test_graph.py test_reconcile.py test_state.py test_runtime.py test_augment.py test_quality.py test_audit.py test_triage.py test_prerequisites.py test_baseline.py test_content.py test_name_links.py test_dependencies.py test_discovery.py
