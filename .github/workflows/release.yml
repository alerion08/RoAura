name: Build and publish RoAura

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

# Default to read-only; the release job alone needs write access.
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          # Keep CI reproducible. The floating 8.0.x feed briefly resolved to
          # an unavailable 8.0.427 archive and stopped every build before the
          # compiler could run.
          dotnet-version: "8.0.415"

      - name: Verify tag and project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw .\RoAura.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match RoAura.csproj version '$version'. Expected '$expectedTag'."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress --yes

      - name: Run logic tests
        shell: pwsh
        run: dotnet test .\RoAura.Tests\RoAura.Tests.csproj -c Release

      - name: Build portable package and installer
        shell: pwsh
        run: .\build-installer.ps1

      - name: Verify clean release contents
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw .\RoAura.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $requiredFiles = @(
            '.\artifacts\publish\RoAura.exe',
            '.\artifacts\publish\Data\items.springro.json',
            '.\artifacts\publish\Data\item-prices.springro.json',
            ".\artifacts\RoAura-$version-portable.zip",
            ".\artifacts\RoAura-$version-Setup.exe"
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path $requiredFile -PathType Leaf)) {
              throw "Required release file is missing: $requiredFile"
            }
          }

          $forbidden = @(
            'settings.json',
            'active-profile.txt',
            'springro-market-cache.json',
            'springro-market-snapshot.json',
            'debug.log'
          )
          $badFiles = Get-ChildItem .\artifacts -Recurse -Force -File | Where-Object {
            $forbidden -contains $_.Name -or
            $_.FullName -match '[\\/](Profiles|Recovery)[\\/]'
          }
          if ($badFiles) {
            $badFiles.FullName | Write-Error
            throw 'Private configuration files were found in release artifacts.'
          }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $releaseFiles = Get-ChildItem .\artifacts -File | Where-Object {
            $_.Extension -in '.zip', '.exe'
          } | Sort-Object Name
          if (-not $releaseFiles) { throw 'No release files were produced.' }
          $lines = foreach ($file in $releaseFiles) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content .\artifacts\SHA256SUMS.txt -Encoding ascii

      - name: Upload portable workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: RoAura-portable-${{ github.run_number }}-${{ github.sha }}
          path: |
            artifacts/*-portable.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload installer workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: RoAura-installer-${{ github.run_number }}-${{ github.sha }}
          path: |
            artifacts/*-Setup.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create version tag from main
        id: tag
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw .\RoAura.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "v$version"

          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $tag already exists; nothing to publish."
            "created=false" | Add-Content -Path $env:GITHUB_OUTPUT
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate $tag --message "RoAura $version"
          git push origin $tag
          "created=true" | Add-Content -Path $env:GITHUB_OUTPUT

      # Publish only for an explicit version tag, or for the main push that
      # just created a new tag. A plain push to main with an unchanged version
      # must never re-upload (--clobber) assets into an existing release.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || steps.tag.outputs.created == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          else {
            [xml]$project = Get-Content -Raw .\RoAura.csproj
            $releaseTag = "v$([string]$project.Project.PropertyGroup.Version)"
          }

          $assets = @(
            (Get-ChildItem .\artifacts\*.zip).FullName
            (Get-ChildItem .\artifacts\*.exe).FullName
            (Resolve-Path .\artifacts\SHA256SUMS.txt).Path
          )
          gh release view $releaseTag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $releaseTag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          }
          else {
            gh release create $releaseTag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --title "RoAura $($releaseTag.TrimStart('v'))" `
              --generate-notes `
              --verify-tag
          }
