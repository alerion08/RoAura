name: Build and publish RoAura

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Verify tag and project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw .\RoAura.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match RoAura.csproj version '$version'. Expected '$expectedTag'."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Run logic tests
        shell: pwsh
        run: dotnet test .\RoAura.Tests\RoAura.Tests.csproj -c Release

      - name: Build portable package and installer
        shell: pwsh
        run: .\build-installer.ps1

      - name: Verify clean release contents
        shell: pwsh
        run: |
          $requiredFiles = @(
            '.\artifacts\publish\RoAura.exe',
            '.\artifacts\publish\Data\items.springro.json',
            '.\artifacts\publish\Data\item-prices.springro.json'
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path $requiredFile -PathType Leaf)) {
              throw "Required release file is missing: $requiredFile"
            }
          }

          $forbidden = @(
            'settings.json',
            'active-profile.txt',
            'springro-market-cache.json',
            'springro-market-snapshot.json',
            'debug.log'
          )
          $badFiles = Get-ChildItem .\artifacts -Recurse -Force -File | Where-Object {
            $forbidden -contains $_.Name -or
            $_.FullName -match '[\\/](Profiles|Recovery)[\\/]'
          }
          if ($badFiles) {
            $badFiles.FullName | Write-Error
            throw 'Private configuration files were found in release artifacts.'
          }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $releaseFiles = Get-ChildItem .\artifacts -File | Where-Object {
            $_.Extension -in '.zip', '.exe'
          } | Sort-Object Name
          if (-not $releaseFiles) { throw 'No release files were produced.' }
          $lines = foreach ($file in $releaseFiles) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content .\artifacts\SHA256SUMS.txt -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: RoAura-build-${{ github.run_number }}-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create version tag from main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw .\RoAura.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "v$version"

          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $tag already exists; nothing to publish."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate $tag --message "RoAura $version"
          git push origin $tag

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          else {
            [xml]$project = Get-Content -Raw .\RoAura.csproj
            $releaseTag = "v$([string]$project.Project.PropertyGroup.Version)"
          }

          $assets = @(
            (Get-ChildItem .\artifacts\*.zip).FullName
            (Get-ChildItem .\artifacts\*.exe).FullName
            (Resolve-Path .\artifacts\SHA256SUMS.txt).Path
          )
          gh release view $releaseTag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $releaseTag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          }
          else {
            gh release create $releaseTag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --title "RoAura $($releaseTag.TrimStart('v'))" `
              --generate-notes `
              --verify-tag
          }
