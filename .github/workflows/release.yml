name: Build and publish RoAura

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

# Default to read-only; the release job alone needs write access.
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          # Keep CI reproducible. The floating 8.0.x feed briefly resolved to
          # an unavailable 8.0.427 archive and stopped every build before the
          # compiler could run.
          dotnet-version: "8.0.415"

      - name: Verify tag and project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw .\RoAura.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match RoAura.csproj version '$version'. Expected '$expectedTag'."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress --yes

      - name: Validate ToC catalog and importer
        shell: pwsh
        run: |
          python -m unittest discover -s tools -p 'test_*toc*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/inspect_toc_database.py Data/database.toc.sqlite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare pinned ROQuestie consumer for reader tests
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess
          revision = '41bfc483311fa0e24ee84d1b1edcb0b4558914bd'
          subprocess.run(['git', 'fetch', '--depth=1', 'origin', revision], check=True)
          payload = subprocess.check_output(['git', 'show', revision + ':research/quest-database/output/questie_catalog.sqlite'])
          assert hashlib.sha256(payload).hexdigest() == '7c89954c66b90603467ee4b645979fe4bad46ff0003ebaf9073e32c18d748745'
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'questie_catalog.sqlite').write_bytes(payload)
          pathlib.Path('Data/questie_catalog.sqlite').write_bytes(payload)
          semantic_revision = 'e3206beccbdd414c6d6f31d146d168247634c578'
          subprocess.run(['git', 'fetch', '--depth=1', 'origin', semantic_revision], check=True)
          semantic = subprocess.check_output(['git', 'show', semantic_revision + ':research/quest-database/output/quest_semantic.sqlite'])
          assert hashlib.sha256(semantic).hexdigest() == 'af4de49aa11587dc6ec971aa019c6ff60e6ed4aa3fee802c61282db65ac7091d'
          pathlib.Path('Data/quest_semantic.sqlite').write_bytes(semantic)

      - name: Run logic tests
        env:
          ROAURA_QUEST_SEMANTIC_TEST_PATH: ${{ format('{0}/Data/quest_semantic.sqlite', github.workspace) }}
          ROAURA_QUEST_CATALOG_TEST_PATH: ${{ format('{0}/questie_catalog.sqlite', runner.temp) }}
        shell: pwsh
        run: dotnet test .\RoAura.Tests\RoAura.Tests.csproj -c Release

      - name: Build portable package and installer
        env:
          ROAURA_QUEST_UI_SNAPSHOTS: ${{ format('{0}/artifacts/roquestie-ui', github.workspace) }}
        shell: pwsh
        run: .\build-installer.ps1

      - name: Verify installed database payload
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw .\RoAura.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $installRoot = Join-Path $env:RUNNER_TEMP 'RoAura-install-check'
          $setup = Start-Process -FilePath (Resolve-Path ".\artifacts\RoAura-$version-Setup.exe") -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installRoot`"") -PassThru
          if (-not $setup.WaitForExit(60000)) { Stop-Process -Id $setup.Id -Force; throw 'Installer verification timed out.' }
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          foreach ($file in @('database.toc.sqlite', 'questie_catalog.sqlite', 'quest_semantic.sqlite', 'quest_fact_comments.ru.json', 'GFDL-1.3.txt', 'GPL-3.0.txt', 'QUEST_SOURCES.txt', 'questie_catalog.NOTICE.txt', 'quest_semantic.NOTICE.txt')) {
            $installed = Join-Path $installRoot "Data/$file"
            if (-not (Test-Path $installed -PathType Leaf)) { throw "Installer is missing Data/$file" }
            $expected = (Get-FileHash ".\artifacts\publish\Data\$file" -Algorithm SHA256).Hash
            if ((Get-FileHash $installed -Algorithm SHA256).Hash -ne $expected) { throw "Installed file differs: $file" }
          }

      - name: Verify clean release contents
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw .\RoAura.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $requiredFiles = @(
            ".\docs\releases\$version.md",
            '.\artifacts\publish\RoAura.exe',
            '.\artifacts\publish\Data\items.springro.json',
            '.\artifacts\publish\Data\item-prices.springro.json',
            '.\artifacts\publish\Data\database.toc.sqlite',
            '.\artifacts\publish\Data\database.toc.manifest.json',
            '.\artifacts\publish\Data\questie_catalog.sqlite',
            '.\artifacts\publish\Data\quest_semantic.sqlite',
            '.\artifacts\publish\Data\quest_fact_comments.ru.json',
            '.\artifacts\publish\Data\GFDL-1.3.txt',
            '.\artifacts\publish\Data\QUEST_SOURCES.txt',
            ".\artifacts\RoAura-$version-portable.zip",
            ".\artifacts\RoAura-$version-Setup.exe"
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path $requiredFile -PathType Leaf)) {
              throw "Required release file is missing: $requiredFile"
            }
          }

          $forbidden = @(
            'settings.json',
            'active-profile.txt',
            'springro-market-cache.json',
            'springro-market-snapshot.json',
            'market-watch-history.json',
            'debug.log'
          )
          $badFiles = Get-ChildItem .\artifacts -Recurse -Force -File | Where-Object {
            $forbidden -contains $_.Name -or
            $_.FullName -match '[\\/](Profiles|Recovery)[\\/]'
          }
          if ($badFiles) {
            $badFiles.FullName | Write-Error
            throw 'Private configuration files were found in release artifacts.'
          }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $releaseFiles = Get-ChildItem .\artifacts -File | Where-Object {
            $_.Extension -in '.zip', '.exe'
          } | Sort-Object Name
          if (-not $releaseFiles) { throw 'No release files were produced.' }
          $lines = foreach ($file in $releaseFiles) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content .\artifacts\SHA256SUMS.txt -Encoding ascii

      - name: Upload portable workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: RoAura-portable-${{ github.run_number }}-${{ github.sha }}
          path: |
            artifacts/*-portable.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload installer workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: RoAura-installer-${{ github.run_number }}-${{ github.sha }}
          path: |
            artifacts/*-Setup.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload UI validation snapshots
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: RoAura-ui-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/roquestie-ui/*.png
          if-no-files-found: error

      - name: Create version tag from main
        id: tag
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw .\RoAura.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "v$version"

          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $tag already exists; nothing to publish."
            "created=false" | Add-Content -Path $env:GITHUB_OUTPUT
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate $tag --message "RoAura $version"
          git push origin $tag
          "created=true" | Add-Content -Path $env:GITHUB_OUTPUT

      # Publish only for an explicit version tag, or for the main push that
      # just created a new tag. A plain push to main with an unchanged version
      # must never re-upload (--clobber) assets into an existing release.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || steps.tag.outputs.created == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          else {
            [xml]$project = Get-Content -Raw .\RoAura.csproj
            $releaseTag = "v$([string]$project.Project.PropertyGroup.Version)"
          }

          [xml]$releaseProject = Get-Content -Raw .\RoAura.csproj
          $releaseVersion = [string]$releaseProject.Project.PropertyGroup.Version
          $releaseNotes = ".\docs\releases\$releaseVersion.md"
          if (-not (Test-Path $releaseNotes -PathType Leaf)) {
            throw "Release notes are missing: $releaseNotes"
          }

          $assets = @(
            (Get-ChildItem .\artifacts\*.zip).FullName
            (Get-ChildItem .\artifacts\*.exe).FullName
            (Resolve-Path .\artifacts\SHA256SUMS.txt).Path
          )
          gh release view $releaseTag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $releaseTag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          }
          else {
            gh release create $releaseTag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --title "RoAura $($releaseTag.TrimStart('v'))" `
              --notes-file $releaseNotes `
              --verify-tag
          }
